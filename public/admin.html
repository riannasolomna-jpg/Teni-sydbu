<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Админка — Архив Дома</title><link rel="stylesheet" href="/style.css"><style>
.admin-wrap{max-width:900px;margin:30px auto;padding:0 20px}.admin-panel{background:var(--paper);border:1px solid var(--line);padding:24px;border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:22px}.admin-panel h1,.admin-panel h2{color:var(--green-900)}.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.admin-field{display:flex;flex-direction:column;gap:6px;margin:12px 0}.admin-field.full{grid-column:1/-1}.admin-field input,.admin-field select,.admin-field textarea{width:100%;border:1px solid var(--line);border-radius:10px;background:#fff;padding:11px 12px;color:var(--ink)}.admin-field textarea{min-height:130px;resize:vertical}.admin-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.admin-error{color:var(--red-800);margin-top:10px}.admin-ok{color:var(--green-800);margin-top:10px}.block-editor{border:1px solid var(--line);padding:15px;border-radius:12px;margin:12px 0;background:var(--paper-2)}.block-editor .remove{float:right}.admin-post{display:flex;justify-content:space-between;gap:15px;align-items:center;border-top:1px solid var(--line);padding:13px 0}.admin-post small{color:var(--muted)}@media(max-width:650px){.admin-grid{grid-template-columns:1fr}.admin-field.full{grid-column:auto}.admin-wrap{padding:0 14px}.admin-panel{padding:18px}.admin-post{align-items:flex-start;flex-direction:column}}
</style></head><body><header class="site-header"><a class="brand" href="/"> <span class="brand-mark">А</span><span><strong>Архив Дома</strong><small>Администрирование</small></span></a><div class="header-actions"><a class="icon-button" href="/" aria-label="На сайт">⌂</a></div></header>
<main class="admin-wrap"><section id="loginPanel" class="admin-panel"><h1>Вход в админку</h1><p>Доступ к управлению архивом есть только у создателя.</p><form id="loginForm"><div class="admin-field"><label for="password">Пароль администратора</label><input id="password" type="password" required autocomplete="current-password"></div><button class="primary-button" type="submit">Войти</button><div id="loginMsg"></div></form></section>
<section id="editorPanel" class="admin-panel" hidden><h1 id="formTitle">Новый материал</h1><form id="postForm"><div class="admin-grid"><div class="admin-field"><label>Название</label><input id="title" maxlength="200" required></div><div class="admin-field"><label>Краткое описание</label><input id="excerpt" maxlength="1000"></div><div class="admin-field"><label>Раздел</label><select id="category"></select></div><div class="admin-field"><label>Подраздел</label><select id="section"></select></div><div class="admin-field full"><label for="image">Изображение</label><input id="image" type="url" maxlength="2000" placeholder="https://..."><small>Необязательно. Вставь прямую ссылку на изображение. R2 и загрузка файлов не требуются.</small><div id="imageStatus"></div></div></div><h2>Содержание</h2><div id="blocks"></div><div class="admin-actions"><button class="primary-button" type="button" id="addBlock">+ Добавить блок</button><button class="primary-button" type="submit">Сохранить материал</button><button type="button" id="cancelEdit">Очистить форму</button></div><div id="saveMsg"></div></form></section>
<section id="postsPanel" class="admin-panel" hidden><h2>Материалы архива</h2><div id="adminPosts"></div></section></main><script>
  window.addEventListener("DOMContentLoaded", function () {
    var msg = document.getElementById("loginMsg");
    if (msg) {
      msg.className = "admin-ok";
      msg.textContent = "Админка загружается…";
      setTimeout(function () {
        if (!window.__ARHIV_ADMIN_READY) {
          msg.className = "admin-error";
          msg.textContent = "Скрипт админки не запустился. Обновите страницу ещё раз.";
        }
      }, 1200);
    }
  });
</script>
<script src="/admin.js?v=20260905-2" defer></script></body></html>
